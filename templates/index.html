{% extends 'base.html' %}
{% block title %}Home page{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center align-itens-center min-vh-content">
        <div class="col-md-6">
            <div class="card p-4 shadow-lg">
                <img src="{{ url_for('static',filename='img/icone.png') }}" alt="Logo" class="img-fluid mx-auto d-block mb-4" width="128">
                <h3>Extraia o texto de uma imagem aqui!</h3>
                <form action="/textoExtraido" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="Imagem" class="form-label">
                            Selecione uma imagem:
                        </label>
                        <input type="file" class="form-control" name="imagem" accept="img/*" value="" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Extrair texto</button>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
